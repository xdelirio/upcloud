include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Freezed/json_serializable DTOs read better without this.
    sort_constructors_first: false
    # Keep classic constructor syntax: freezed/json_serializable generators
    # expect `ClassName.named(...)` declarations.
    unnecessary_type_name_in_constructor: false
