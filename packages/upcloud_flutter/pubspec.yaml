  shared_preferences: ^2.5.5
  upcloud: ^0.1.0-dev.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  mocktail: ^1.0.5
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

