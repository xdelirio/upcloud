# Tests tagged `live` call the real provider APIs with the credentials of
# the `.env` file at the root of the repository. They are skipped by
# default; run them with the `live` preset (see CONTRIBUTING.md):
#
#   dart test -P live
tags:
  live:
    skip: "Live test: run it with `dart test -P live` (see CONTRIBUTING.md)"

presets:
  live:
    include_tags: live
    # One provider at a time: the tests share the accounts and folders.
    concurrency: 1
    tags:
      live:
        skip: false
