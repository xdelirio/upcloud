name: upcloud
description: >-
  Unified API to browse and upload files across multiple cloud and video
  hosting providers (XVideoSharing-based hosts, Byse, MediaFire and more).
version: 0.1.0-dev.1
repository: https://github.com/xdelirio/upcloud
topics:
  - cloud
  - storage
  - upload
  - download
  - video

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.19.0

dev_dependencies:
  build_runner: ^2.16.1
  freezed: ^4.0.1
  http_mock_adapter: ^0.6.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  test: ^1.31.1
  very_good_analysis: ^11.0.0
