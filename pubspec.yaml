name: upcloud
description: >-
  Multi-cloud upload manager: browse and upload files across many cloud and
  video hosting providers (XVideoSharing-based hosts, Byse, MediaFire and
  more).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  background_downloader: ^9.6.3
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dio: ^5.11.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  liquid_glass_widgets: ^1.7.2
  meta: ^1.19.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mime: ^2.1.0
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
